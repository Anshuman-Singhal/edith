name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --locked
      - run: ./edith test lint
      - run: ./edith test unit
      - run: ./edith test contract
      - run: ./edith test integration
      - run: ./edith test e2e

  android:
    # Serial, never alongside e2e (C77). Runs without the RayNeo SDK: the generic flavor and
    # :platform-api must still build (L13). Gradle retries once on HTTP 429 (L27).
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 platforms;android-35 platforms;android-36 build-tools;36.0.0 platform-tools"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: ./edith test golden
      - run: ./edith test android
