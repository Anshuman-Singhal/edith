[project]
name = "edith-common"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.13,<3",
  "jsonschema>=4.26,<5",
  "pymap3d>=3.2,<4",
  "mgrs>=1.7,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edith_common"]
