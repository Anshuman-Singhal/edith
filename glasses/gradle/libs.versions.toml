# Authoritative Android/Kotlin pins (PLAN §4.2, L12, C43). Verified by the r3 probe (L27).
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "4.12.0"
appcompat = "1.7.1"
lifecycle = "2.9.4"
junit = "4.13.2"
robolectric = "4.16.1"
